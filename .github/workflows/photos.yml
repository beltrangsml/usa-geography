name: Fetch photos
on:
  push:
    paths: ['tools/photos.json', 'tools/fetch_photos.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_photos.py
      - run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add assets/photos
          git commit -m "Photos: fetched from Wikimedia Commons (free licences)" || exit 0
          git push
